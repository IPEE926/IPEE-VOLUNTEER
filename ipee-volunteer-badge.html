<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPEE Volunteer Badge</title>
<style>
:root{--navy:#1F4E79;--teal:#1A9E8F;--gold:#F2B705;--ink:#1b1b1b;--bg:#f2f5f8}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);padding:20px}
.wrap{max-width:420px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px;color:var(--navy)}
p.sub{margin:0 0 16px;font-size:14px;color:#555}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 4px}
input[type=text]{width:100%;padding:11px;font-size:16px;border:1px solid #c5ced6;border-radius:8px}
input[type=file]{width:100%;font-size:14px}
button{width:100%;margin-top:18px;padding:13px;font-size:16px;font-weight:bold;color:#fff;background:var(--teal);border:0;border-radius:8px}
.stage{display:flex;justify-content:center;margin:24px 0}
#badge{width:320px;height:490px;background:#fff;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 4px 18px rgba(0,0,0,.18);text-align:center}
.slot{position:absolute;top:10px;left:50%;width:56px;height:10px;margin-left:-28px;border-radius:6px;background:rgba(255,255,255,.35)}
.head{background:var(--navy);color:#fff;padding:30px 16px 16px}
.head .org{font-size:11px;letter-spacing:1.4px;font-weight:bold;line-height:1.4}
.ribbon{background:var(--gold);color:#1b1b1b;font-weight:bold;letter-spacing:4px;font-size:15px;padding:7px 0}
.photo{width:150px;height:150px;border-radius:50%;margin:22px auto 14px;border:6px solid var(--teal);background:#dfe7ee;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:bold;color:var(--navy)}
.photo img{width:100%;height:100%;object-fit:cover}
.name{font-size:24px;font-weight:bold;color:var(--navy);padding:0 14px;line-height:1.2}
.role{font-size:15px;margin-top:6px;color:#333;padding:0 14px}
.num{display:inline-block;margin-top:16px;padding:8px 18px;border:2px solid var(--teal);border-radius:8px;font-size:18px;font-weight:bold;letter-spacing:1px;color:var(--teal)}
.foot{position:absolute;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:11px 10px;font-size:11px;line-height:1.5}
.foot b{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <h1>IPEE Volunteer Badge</h1>
  <p class="sub">Fill in the details. Your badge appears below.</p>

  <label for="name">Full name</label>
  <input type="text" id="name" placeholder="e.g. Ada Okafor">
  <label for="role">Volunteer role</label>
  <input type="text" id="role" value="Volunteer Relations Officer">
  <label for="num">Volunteer number</label>
  <input type="text" id="num" value="IPEE-VOL-001">
  <label for="photo">Passport photograph</label>
  <input type="file" id="photo" accept="image/*">

  <div class="stage">
    <div id="badge">
      <div class="head"><div class="slot"></div>
        <div class="org">INSTITUTE FOR<br>PATIENT EXPERIENCE EXCELLENCE</div></div>
      <div class="ribbon">VOLUNTEER</div>
      <div class="photo" id="pbox">A</div>
      <div class="name" id="oName">Your Name</div>
      <div class="role" id="oRole">Volunteer Relations Officer</div>
      <div class="num" id="oNum">IPEE-VOL-001</div>
      <div class="foot"><b>#DesignedNotByChance</b><br>www.institutepee.org</div>
    </div>
  </div>

  <button id="dl">Download badge (PNG)</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
var $ = function(id){return document.getElementById(id)};
var photoURL = "";
function render(){
  var n = $("name").value.trim();
  $("oName").textContent = n || "Your Name";
  $("oRole").textContent = $("role").value.trim() || "Volunteer";
  $("oNum").textContent = $("num").value.trim() || "IPEE-VOL-000";
  var box = $("pbox");
  if (photoURL) { box.innerHTML = '<img src="' + photoURL + '" alt="">'; }
  else { box.textContent = n ? n.charAt(0).toUpperCase() : "A"; }
}
["name","role","num"].forEach(function(id){$(id).addEventListener("input", render)});
$("photo").addEventListener("change", function(e){
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){ photoURL = r.result; render(); };
  r.readAsDataURL(f);
});
$("dl").addEventListener("click", function(){
  html2canvas($("badge"), {scale:3, backgroundColor:null, useCORS:true}).then(function(c){
    var a = document.createElement("a");
    var nm = ($("name").value.trim() || "volunteer").replace(/\s+/g,"-");
    a.download = "IPEE-Volunteer-Badge-" + nm + ".png";
    a.href = c.toDataURL("image/png");
    a.click();
  });
});
render();
</script>
</body>
</html>
